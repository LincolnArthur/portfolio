# Configuração do Netlify: o site é estático, não precisa de build
[build]
  publish = "."

# Segurança básica
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# As fontes nunca mudam: o navegador pode guardar por 1 ano.
# O resto usa o padrão do Netlify (sempre confere se há versão nova).
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
